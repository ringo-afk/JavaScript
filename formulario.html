<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mi sitio web</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Iniciar sesión</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Perfil</a></li>
                    <li class="nav-item"><a class="nav-link active" href="formulario.html">Formulario</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
            <h2 class="mb-4 text-center">Formulario Interactivo</h2>

            <div class="mb-4 border-bottom pb-3">
                <h5>1. Mostrar/Ocultar Contenido</h5>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="visibilidad" id="radioOcultar" value="ocultar" checked>
                    <label class="form-check-label" for="radioOcultar">Ocultar contenido</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="visibilidad" id="radioMostrar" value="mostrar">
                    <label class="form-check-label" for="radioMostrar">Mostrar contenido</label>
                </div>
                <div id="contenido-oculto" class="alert alert-success mt-2 d-none">
                    Has encontrado el contenido oculto
                </div>
            </div>

            <div class="mb-4 border-bottom pb-3">
                <h5>2. Selección de País y Región</h5>
                <label for="country" class="form-label">País:</label>
                <select id="country" class="form-select mb-2">
                    <option value="">Selecciona un país...</option>
                </select>

                <label for="region" class="form-label">Región/Estado:</label>
                <select id="region" class="form-select">
                    <option value="">Selecciona una región...</option>
                </select>
            </div>

            <div class="mb-3">
                <h5>3. Validar Términos</h5>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="check1">
                    <label class="form-check-label" for="check1">Acepto los términos y condiciones</label>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="check2">
                    <label class="form-check-label" for="check2">Soy mayor de edad</label>
                </div>
                <button type="button" id="btnEnviar" class="btn btn-success w-100" disabled>Enviar Formulario</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
